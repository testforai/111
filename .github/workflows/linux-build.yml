name: linux-build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - name: Verify report output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -R "跨境平台二次开发项目雷达" dist
          if grep -R -n -E "\?\?\?\?|�" dist; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-report-dist
          path: dist
          if-no-files-found: error
