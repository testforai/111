name: linux-build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify report output
        run: |
          test -f dist/server/index.js
          test -d dist/client/assets
          test -f dist/.openai/hosting.json
          grep -q "跨境平台二次开发项目全景报告" app/page.jsx
          grep -q '"uniqueRepositories":1358' src/data/repos.json
          if grep -R -n -E "\?\?\?\?|�" app src dist/client; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-report-dist
          path: dist
          if-no-files-found: error
